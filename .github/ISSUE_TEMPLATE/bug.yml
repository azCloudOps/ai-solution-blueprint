name: Bug report
description: Something is broken or produces a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (shown under the title, or aiblueprint --version)
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Web app, CLI, Library]
  - type: textarea
    id: answers
    attributes:
      label: Answers JSON (remove anything confidential)
      render: json
