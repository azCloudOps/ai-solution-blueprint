name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-kb.mjs
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        run: |
          node bin/aiblueprint.js example access --out /tmp/a.json
          node bin/aiblueprint.js render /tmp/a.json --out /tmp/out
          test -s /tmp/out/blueprint.md && test -s /tmp/out/architecture.svg
