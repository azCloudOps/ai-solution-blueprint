name: Monthly knowledge base review
on:
  schedule:
    - cron: "0 14 25 * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  open-review-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT=$(date -d "$(date +%Y-%m-01) +1 month" +%B\ %Y)
          LIST=$(node scripts/check-kb.mjs --list || true)
          {
            echo "Monthly knowledge base review for the $NEXT release (first Tuesday)."
            echo
            echo "- [ ] Confirm every flagged service name against the provider's documentation"
            echo "- [ ] Review provider release notes and this month's events for renames, retirements and GA changes"
            echo "- [ ] Review OWASP LLM Top 10, NIST AI RMF, EU AI Act dates and FOCUS for changes"
            echo "- [ ] Triage open 'kb-update' issues"
            echo "- [ ] Bump kbVersion and lastReviewed"
            echo "- [ ] Update CHANGELOG and ROADMAP"
            echo
            echo '```'
            echo "$LIST"
            echo '```'
          } > body.md
          gh label create kb-review --color 4A86E8 --force >/dev/null 2>&1 || true
          gh issue create --title "Knowledge base review: $NEXT release" --label kb-review --body-file body.md
