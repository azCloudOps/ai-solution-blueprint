name: Mobile - Android (Google Play)
# Builds a signed Android App Bundle (.aab) for Google Play on every release tag,
# or on demand. Uploads to the Play internal testing track when the service account
# secret is present. See docs/MOBILE.md for the one-time setup and required secrets.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      build_seq:
        description: "Build number within this version (0-99). Raise it to re-upload the same version."
        default: "0"
      track:
        description: "Play track to upload to"
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check signing secrets
        id: gate
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$K" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets are not set yet, so the store build was skipped. See docs/MOBILE.md."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Test the engine
        if: steps.gate.outputs.ok == 'true'
        run: npm test
      - name: Build web bundle and sync Capacitor
        if: steps.gate.outputs.ok == 'true'
        working-directory: mobile
        run: |
          npm ci
          npm run build:web
          npx cap sync android
      - name: Decode upload keystore
        if: steps.gate.outputs.ok == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed release bundle
        if: steps.gate.outputs.ok == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_BUILD_SEQ: ${{ github.event.inputs.build_seq || '0' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          ls -la app/build/outputs/bundle/release/
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          name: ai-solution-blueprint-android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
      - name: Check for Play service account
        if: steps.gate.outputs.ok == 'true'
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "enabled=$([ -n "$PLAY_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Upload to Google Play
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.azcloudops.blueprint
          releaseFiles: mobile/android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
