name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          ENG=$(grep -oP 'ENGINE_VERSION = "\K[^"]+' src/engine.js)
          test "$TAG" = "$PKG" || { echo "package.json is $PKG, tag is $TAG"; exit 1; }
          test "$TAG" = "$ENG" || { echo "ENGINE_VERSION is $ENG, tag is $TAG"; exit 1; }
      - run: node scripts/check-kb.mjs
      - run: npm test
      - run: npm run build
      - name: Package assets
        run: |
          cp dist/index.html ai-solution-blueprint.html
          npm pack
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "AI Solution Blueprint $GITHUB_REF_NAME" \
            --notes-file notes.md \
            ai-solution-blueprint.html azcloudops-ai-solution-blueprint-*.tgz
